version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: dayflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dayflow
      POSTGRES_PASSWORD: dayflow_secret
      POSTGRES_DB: dayflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
